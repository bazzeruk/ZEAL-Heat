name: Python tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Home Assistant ${{ matrix.home-assistant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Original pinned baseline.
          - home-assistant: "2025.1.4"
            python-version: "3.12"
            requirements: requirements_test.txt
          # Newest available test harness.
          - home-assistant: "2026.2.3"
            python-version: "3.13"
            requirements: requirements_test_latest.txt
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - name: Install test dependencies
        run: python -m pip install -r ${{ matrix.requirements }}
      - name: Run test suite
        run: python -m pytest tests/ -q
      - name: Compile Python sources
        run: python -m compileall -q custom_components tests
